<button (click)="createNewProduct()">Click</button>
<div class="products--grid">
    <app-product
        [product]="product"
        *ngFor="let product of products"
        (addedProduct)="onAddToShoppingCart($event)"
        (showProduct)="onShowDetail($event)"></app-product>
</div>
<div class="product-detail" [class.active]="showProductDetail">
    <div *ngIf="productChosen">
        <button (click)="toggleProductDetail()">Close</button>
        Contenido
        <h1>{{productChosen.id}}</h1>
        <h1>{{productChosen.title}}</h1>
        <swiper [slidesPerView]="1">
              <ng-template swiperSlide="swiperSlide" *ngFor="let img of productChosen.images">
                <img width="200px" [src]="img" alt="ALT: {{productChosen.title}}">    
              </ng-template>
            
        </swiper>
        <h1>{{productChosen.description}}</h1>
    </div>
</div>
